name: Build iOS shaders.bundle

on:
  workflow_dispatch:
    inputs:
      export_release_tag:
        description: "Release tag with exported-project.tar.gz (default unity-export)"
        required: false
        default: unity-export
  push:
    branches: [main, master]
    paths:
      - scripts/fix_export_shaders.py
      - scripts/ci-build-ios-shaders.sh
      - export-tools/Editor/**
      - ci/catalog-map.json

permissions:
  contents: write

env:
  UNITY_VERSION: 2022.3.62f1
  EXPORT_TAG: ${{ github.event.inputs.export_release_tag || 'unity-export' }}
  SHADER_OUT: ${{ runner.temp }}/ultrakill-ios-shaders-out

jobs:
  ios-shaders:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AssetRipper ExportedProject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_URL: ${{ secrets.UNITY_EXPORT_TAR_URL }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPORT_URL" ]]; then
            curl -fL "$EXPORT_URL" -o exported-project.tar.gz
          elif gh release view "$EXPORT_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$EXPORT_TAG" --repo "${{ github.repository }}" \
              --pattern 'exported-project.tar.gz' -D .
          else
            echo "No export tarball: upload exported-project.tar.gz to release tag $EXPORT_TAG"
            echo "  pwsh scripts/Package-ExportedProject.ps1"
            echo "Or set secret UNITY_EXPORT_TAR_URL."
            exit 1
          fi
          tar -xzf exported-project.tar.gz -C .
          if [[ -d ExportedProject ]]; then
            echo "EXPORT_PROJECT=$GITHUB_WORKSPACE/ExportedProject" >> "$GITHUB_ENV"
          elif [[ -d ultrakill-export/ExportedProject ]]; then
            echo "EXPORT_PROJECT=$GITHUB_WORKSPACE/ultrakill-export/ExportedProject" >> "$GITHUB_ENV"
          else
            echo "Archive did not contain ExportedProject/"
            find . -maxdepth 3 -type d -name ExportedProject || true
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: ExportedProject/Library
          key: ExportLibrary-${{ hashFiles('ci/catalog-map.json', 'export-tools/**') }}
          restore-keys: |
            ExportLibrary-

      - name: Prepare export for iOS shader rebuild
        run: |
          set -euo pipefail
          chmod +x scripts/ci-prepare-export-shaders.sh
          EXPORT_PROJECT="$EXPORT_PROJECT" CATALOG_MAP="$GITHUB_WORKSPACE/ci/catalog-map.json" \
            bash scripts/ci-prepare-export-shaders.sh

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.EXPORT_PROJECT }}
          targetPlatform: iOS
          buildMethod: IosRetailBundleBuild.Build
          versioning: None
          customParameters: >-
            -nographics -batchmode -disableAssemblyUpdater
            -catalogMap ${{ github.workspace }}/ci/catalog-map.json
            -outDir ${{ env.SHADER_OUT }}
            -onlyBundle assets_assets_assets/shaders.bundle

      - name: Stage shader bundle artifacts
        run: |
          set -euo pipefail
          ART="$GITHUB_WORKSPACE/artifacts/ios-shaders"
          mkdir -p "$ART/assets_assets_assets"
          built=$(find "$SHADER_OUT" -name 'shaders.bundle' -type f -print0 | xargs -0 ls -S 2>/dev/null | head -n 1 || true)
          if [[ -z "$built" || ! -f "$built" ]]; then
            echo "shaders.bundle missing under $SHADER_OUT"
            find "$SHADER_OUT" -type f | head -40 || true
            exit 1
          fi
          cp -f "$built" "$ART/assets_assets_assets/shaders.bundle"
          builtin=$(find "$SHADER_OUT" -name 'shader_unitybuiltinshaders.bundle' -type f | head -n 1 || true)
          if [[ -n "$builtin" && -f "$builtin" ]]; then
            cp -f "$builtin" "$ART/shader_unitybuiltinshaders.bundle"
          fi
          ls -lh "$ART/assets_assets_assets/shaders.bundle"

      - name: Upload shader bundles
        uses: actions/upload-artifact@v4
        with:
          name: ios-shaders-bundle
          path: artifacts/ios-shaders/**

      - name: Publish to GitHub Release (ios-shaders-latest)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts/ios-shaders
          zip -r ../ios-shaders-bundle.zip .
          TAG="ios-shaders-latest"
          SHA="${{ github.sha }}"
          RUN="${{ github.run_number }}"
          NOTES="iOS shaders.bundle (Metal recompile, retail shader names) run ${RUN} (${SHA}).

          Device path:
          ULTRAKILL-Content/ULTRAKILL_Data/StreamingAssets/aa/iOS/assets_assets_assets/shaders.bundle
          (+ aa/iOS/shader_unitybuiltinshaders.bundle if included)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ../ios-shaders-bundle.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" ../ios-shaders-bundle.zip --title "Latest iOS shader bundles" --notes "$NOTES"
          fi
