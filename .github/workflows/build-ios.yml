name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.62f1
  PROJECT_PATH: unity-ultrakill
  EXPORT_ARCHIVE: unity-export.tar.gz

jobs:
  patch-assembly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build mobile touch patch
        shell: pwsh
        run: |
          $managed = Join-Path $env:GITHUB_WORKSPACE "game-managed"
          if (Test-Path (Join-Path $managed "UnityEngine.CoreModule.dll")) {
            ./scripts/patch-assembly.ps1 -GameManaged $managed -OutputDir ./artifacts/patched
          } else {
            Write-Host "game-managed/ not present — patch DLL built only when Managed folder is supplied."
          }

      - name: Upload touch patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultrakill-mobile-touch
          path: artifacts/patched/**
          if-no-files-found: ignore

  ios-unsigned:
    needs: patch-assembly
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Unity export (game + touch patch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view unity-export --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download unity-export --repo "${{ github.repository }}" -p "$EXPORT_ARCHIVE" -D .
          else
            echo "::error::No GitHub release tag 'unity-export' with $EXPORT_ARCHIVE. On a Windows PC with ULTRAKILL installed, run: scripts/Export-UnityViaAssetRipper.ps1; scripts/Apply-TouchPatchToUnity.ps1; scripts/Package-UnityExport.ps1; then gh release create unity-export artifacts/unity-export.tar.gz"
            exit 1
          fi
          tar -xzf "$EXPORT_ARCHIVE"
          test -f "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ hashFiles(format('{0}/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: IosUnsignedBuild.Build
          versioning: None
          customParameters: -nographics -batchmode

      - name: Xcode build (unsigned)
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH/build/iOS"
          DERIVED_DATA="$BUILD_DIR/DerivedData"
          cd "$BUILD_DIR"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH/build/iOS"
          APP_PATH="$(find "$BUILD_DIR" -name '*.app' -path '*/Build/Products/*' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found after xcodebuild"
            exit 1
          fi
          rm -rf Payload ULTRAKILL-iOS-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ULTRAKILL-iOS-unsigned.ipa Payload
          echo "Created ULTRAKILL-iOS-unsigned.ipa ($(du -h ULTRAKILL-iOS-unsigned.ipa | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: ultrakill-ios-unsigned-ipa
          path: ULTRAKILL-iOS-unsigned.ipa
