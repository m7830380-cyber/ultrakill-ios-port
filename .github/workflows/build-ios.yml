name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.62f1
  PROJECT_PATH: unity-ios

jobs:
  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ hashFiles(format('{0}/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: IosUnsignedBuild.Build
          versioning: None
          customParameters: -nographics -batchmode

      - name: Xcode build (unsigned)
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH/build/iOS"
          DERIVED_DATA="$BUILD_DIR/DerivedData"
          cd "$BUILD_DIR"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH/build/iOS"
          APP_PATH="$(find "$BUILD_DIR" -name '*.app' -path '*/Build/Products/*' | head -n 1)"
          rm -rf Payload ULTRAKILL-Engine-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ULTRAKILL-Engine-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ultrakill-ios-engine-ipa
          path: ULTRAKILL-Engine-unsigned.ipa
