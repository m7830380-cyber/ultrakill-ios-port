name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  UNITY_VERSION: 2022.3.62f1
  PROJECT_PATH: unity-ultrakill
  IPA_PATH: unity-ultrakill/build/iOS/ULTRAKILL-unsigned.ipa

jobs:
  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ULTRAKILL port tree for CI
        run: bash scripts/ci-prepare-unity-ultrakill.sh

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ hashFiles(format('{0}/**', env.PROJECT_PATH), 'game-sources/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: IosUnsignedBuild.Build
          versioning: None
          customParameters: -nographics -batchmode -disableAssemblyUpdater -burst-disable-compilation

      - name: Xcode build (unsigned)
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH/build/iOS"
          DERIVED_DATA="$BUILD_DIR/DerivedData"
          cd "$BUILD_DIR"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH/build/iOS"
          cd "$BUILD_DIR"
          APP_PATH="$(find "$BUILD_DIR" -name '*.app' -path '*/Build/Products/*' | head -n 1)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "No .app found under $BUILD_DIR"
            find "$BUILD_DIR" -name '*.app' -print || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload ULTRAKILL-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ULTRAKILL-unsigned.ipa Payload
          ls -lh ULTRAKILL-unsigned.ipa
          test -f "$GITHUB_WORKSPACE/$IPA_PATH"

      - name: Upload workflow artifact
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ultrakill-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Publish IPA to GitHub Release (artifact quota fallback)
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/$IPA_PATH"
          if [[ ! -f "$IPA" ]]; then
            echo "IPA missing at $IPA"
            exit 1
          fi
          TAG="ios-latest"
          SHA="${{ github.sha }}"
          RUN="${{ github.run_number }}"
          NOTES="Unsigned ULTRAKILL iOS IPA from workflow run ${RUN} (${SHA})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
            gh release edit "$TAG" --notes "$NOTES (updated $(date -u +%Y-%m-%dT%H:%MZ))"
          else
            gh release create "$TAG" "$IPA" --title "Latest unsigned iOS IPA" --notes "$NOTES"
          fi
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/${TAG}"

      - name: Require IPA published somewhere
        if: always() && !cancelled()
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ steps.artifact.outcome }}" == "success" ]] || { echo "PR builds require workflow artifact upload."; exit 1; }
          else
            [[ "${{ steps.artifact.outcome }}" == "success" || "${{ steps.release.outcome }}" == "success" ]] || {
              echo "Artifact upload failed and GitHub Release upload failed."
              exit 1
            }
          fi
